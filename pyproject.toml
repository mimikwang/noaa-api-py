[project]
name = "noaa"
version = "0.1.0"
description = "Python client to interact with the NOAA api"
readme = "README.md"
authors = [
    { name = "Mimi Wang", email = "mimikwang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.81",
]
